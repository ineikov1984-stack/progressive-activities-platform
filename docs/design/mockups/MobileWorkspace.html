<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),icon=(id)=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[{id:1,activity:'Шахмат',name:'Начинаещи',age:'1.–2. клас',day:'Понеделник и сряда',time:'16:00–17:00',place:'Зала „Слънце“',teacher:'Демо преподавател',count:8,max:12,type:'chess'},{id:2,activity:'Шахмат',name:'Напреднали',age:'3.–4. клас',day:'Вторник и четвъртък',time:'17:30–18:30',place:'Зала „Слънце“',teacher:'Демо преподавател',count:10,max:10,type:'chess'},{id:3,activity:'Рисуване',name:'Малки творци',age:'1.–4. клас',day:'Понеделник',time:'17:00–18:00',place:'Ателие',teacher:'Демо преподавател',count:6,max:10,type:'art'},{id:4,activity:'Баскетбол',name:'Първи стъпки',age:'2.–4. клас',day:'Понеделник и петък',time:'15:00–16:00',place:'Спортна зала',teacher:'Демо преподавател',count:9,max:14,type:'sport'}];
const names=['Анна Демова','Борис Демов','Виктория Демова','Георги Демов','Дария Демова','Емил Демов','Калина Демова','Никола Демов'];
let requests=[{id:1,name:'Мила Демова',group:1,grade:'2. клас'},{id:2,name:'Павел Демов',group:1,grade:'1. клас'},{id:3,name:'Яна Демова',group:4,grade:'3. клас'}];
const grades={};
const rosters=Object.fromEntries(groups.map(g=>[g.id,Array.from({length:g.count},(_,i)=>names[i]||'Демо дете '+(i+1))]));
const state={page:'home',group:1,tab:'requests',groupTab:'children',role:'office',scenario:'normal',query:'',childQuery:'',activity:'all',homeView:'office',marks:{},substitute:false,approval:'manual'};let toastTimer,dialogChild=null,sessionGroup=1,sessionDay='today',sessionDisplayTime=null,reviewMode=false,lastDialogFocus=null;
for(let i=0;i<6;i++)state.marks['yesterday-1-'+i]=i===1?'absent':'present';
for(let i=0;i<9;i++)state.marks['today-4-'+i]='present';
const markKey=i=>sessionDay+'-'+sessionGroup+'-'+i;
const markedFor=(g,day='today')=>rosterNames(g).filter((_,i)=>state.marks[day+'-'+g.id+'-'+i]).length;
const navItems=()=>[{id:'home',label:'Начало',icon:'home'},{id:'schedule',label:'График',icon:'calendar'},...(state.role==='office'?[{id:'enrollments',label:'Записвания',icon:'people'}]:[]),{id:'attendance',label:'Присъствия',icon:'check'}];
const currentNav=()=>state.page==='group'?'enrollments':state.page;
function nav(){const items=navItems();$('desktop-nav').innerHTML=items.map(n=>`<button class="nav-button" data-page="${n.id}" ${currentNav()===n.id?'aria-current="page"':''}>${icon(n.icon)}${n.label}</button>`).join('');$('mobile-nav').innerHTML=items.map(n=>`<button data-page="${n.id}" ${currentNav()===n.id?'aria-current="page"':''}>${icon(n.icon)}${n.label}</button>`).join('');}
const badge=g=>`<span class="tag ${g.type}">${g.activity}</span>`;
const capacity=g=>`<div class="capacity"><span>${g.count} от ${g.max} места${g.count===g.max?' · Пълна':''}</span><span class="track ${g.count===g.max?'full':''}"><span style="width:${g.count/g.max*100}%"></span></span></div>`;
function head(title,note,action=''){return `<header class="page-head"><div><h1>${title}</h1>${note?`<p class="head-note">${note}</p>`:''}</div>${action}</header>`;}
function session(g,time,done=false){done=done||markedFor(g)===g.count;return `<article class="schedule-row"><div class="time">${time}<small>${time==='15:00'?'16:00':time==='16:00'?'17:00':'18:00'}</small></div><div>${badge(g)}<h3 style="margin-top:6px">${g.name}</h3><p>${g.age} · ${g.place}</p>${done?'<span class="tag success">✓ Всички са отбелязани</span>':`<span class="tag warning">${g.count-markedFor(g)} чакат отбелязване</span>`}<div style="margin-top:12px"><button class="btn ${done?'':'primary'} small" data-attendance="${g.id}" ${done?'data-review="true"':''}>${done?'Прегледай':'Отбележи присъствия'}${icon('arrow')}</button></div></div></article>`;}
function home(){const office=state.role==='office'&&state.homeView==='office';const pending=groups[0].count-markedFor(groups[0],'yesterday');const tasks=(office&&requests.length?1:0)+(office&&!state.substitute?1:0)+(pending?1:0);return `<div class="eyebrow">ПОНЕДЕЛНИК, 2 НОЕМВРИ</div>${head('Добър ден, Демо',office?'Най-важното за екипа, на едно място.':'Вашите занимания и задачи за днес.')}${state.role==='office'?`<div class="overview-switch" role="group" aria-label="Обхват на таблото"><button aria-pressed="${office}" data-home="office">За организацията</button><button aria-pressed="${!office}" data-home="mine">Моите занимания</button></div>`:''}<div class="split"><section aria-labelledby="attention-title"><div class="section-title"><h2 id="attention-title">Изисква внимание</h2><small>${tasks} ${tasks===1?'задача':'задачи'}</small></div><div class="panel">${office&&requests.length?`<button class="task task-link" data-requests><span class="task-icon">${icon('people')}</span><span class="task-content"><strong>${requests.length} ${requests.length===1?'нова заявка':'нови заявки'}</strong><span class="task-sub">Шахмат и баскетбол</span></span>${icon('arrow')}</button>`:''}${office&&!state.substitute?`<button class="task task-link" data-substitute><span class="task-icon info">${icon('swap')}</span><span class="task-content"><strong>Заместник за сряда</strong><span class="task-sub">Шахмат · 4 ноември, 16:00</span></span>${icon('arrow')}</button>`:''}${pending?`<button class="task task-link" data-attendance="1" data-sessionday="yesterday"><span class="task-icon">${icon('check')}</span><span class="task-content"><strong>${pending} неотбелязани деца</strong><span class="task-sub">Присъствия от вчера</span></span>${icon('arrow')}</button>`:''}${!tasks?'<div class="panel-pad"><strong>✓ Всичко е прегледано</strong><p class="muted">Няма чакащи задачи.</p></div>':''}</div></section><section aria-labelledby="today-title"><div class="section-title"><h2 id="today-title">${office?'Занимания днес':'Моите занимания'}</h2><button class="btn quiet small" data-page="schedule">График ${icon('arrow')}</button></div><div class="panel">${office?session(groups[3],'15:00',true):''}${session(groups[0],'16:00')}${office?session(groups[2],'17:00'):''}</div></section></div>`;}
function groupCard(g){return `<article class="panel group-card">${badge(g)}<div><h3>${g.name}</h3><p class="muted">${g.age}</p><p class="group-meta">${icon('clock')}${g.day} · ${g.time}</p><p class="group-meta">${icon('pin')}${g.place}</p></div><div class="group-footer">${capacity(g)}<button class="btn small" data-group="${g.id}">Виж децата ${icon('arrow')}</button></div></article>`;}
function requestCard(r){const g=groups.find(g=>g.id===r.group);return `<article class="request"><div class="request-top"><span class="child-initials">${r.name.split(' ').map(n=>n[0]).join('')}</span><div><h3>${r.name}</h3><small>${r.grade} · Редовно записване</small></div><span class="tag warning">Нова</span></div>${badge(g)}<strong style="display:block;margin-top:8px">${g.name} · ${g.age}</strong><p>${g.day} · ${g.time}</p><div class="request-actions"><button class="btn primary" data-approve="${r.id}">${icon('check')}Одобри</button><button class="btn" data-request-details="${r.id}">Подробности</button></div></article>`;}
function enrollments(){return `${head('Записвания','Заявки и деца в групите.')}<div class="overview-switch" role="group" aria-label="Записвания"><button  data-tab="requests" aria-pressed="${state.tab==='requests'}">Заявки <span class="number">${requests.length}</span></button><button  data-tab="groups" aria-pressed="${state.tab==='groups'}">Групи <span class="number">${groups.length}</span></button></div>${state.tab==='requests'?`<div class="section-title"><h2>Очакват решение</h2><small>${requests.length} заявки</small></div><div class="panel">${requests.length?requests.map(requestCard).join(''):empty('Всички заявки са обработени','Новите заявки ще се показват тук.','Виж групите','data-show-groups')}</div>`:`<div class="toolbar"><label class="search"><span class="sr">Търси група или дейност</span>${icon('search')}<input id="group-search" type="search" placeholder="Търси група или дейност" value="${esc(state.query)}"></label><label><span class="sr">Дейност</span><select id="activity-filter"><option value="all">Всички дейности</option>${['Шахмат','Рисуване','Баскетбол'].map(a=>`<option ${state.activity===a?'selected':''}>${a}</option>`).join('')}</select></label></div><div class="group-grid" id="group-results">${filteredGroups()}</div>`}`;}
function filteredGroups(){const found=groups.filter(g=>(state.activity==='all'||g.activity===state.activity)&&(g.activity+' '+g.name+' '+g.age).toLowerCase().includes(state.query.toLowerCase()));return found.length?found.map(groupCard).join(''):empty('Няма намерени групи','Опитайте с друго име или премахнете филтъра.','Изчисти филтрите','data-clear-filters');}
function rosterNames(g){return rosters[g.id];}
function childRow(name,i){return `<div class="child-row"><span class="child-initials">${name.split(' ').map(n=>n[0]).slice(0,2).join('')}</span><div class="child-copy"><strong>${name}</strong><small>${grades[name]||((i%2+1)+'. клас')}${i===2?' · Пробно посещение':''}</small></div><button class="icon-button" data-child="${i}" aria-label="Виж ${name}">${icon('eye')}</button></div>`;}

 if(b.dataset.calView){if(b.dataset.calView==='day'&&c.view!=='day')c.by='rooms';c.view=b.dataset.calView;c.selected=[];render(false);return;}
 if(b.dataset.calBy){c.by=b.dataset.calBy;render(false);return;}
 if(b.hasAttribute('data-cal-today')){c.date='2026-11-02';c.selected=[];render(false);return;}
 if(b.dataset.calStep){const n=Number(b.dataset.calStep);if(c.view==='month'){const d=new Date(c.date+'T12:00:00Z');d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);c.date=d.toISOString().slice(0,10);}else c.date=dateShift(c.date,n*(c.view==='day'?1:7));c.selected=[];render(false);return;}
 if(b.dataset.calDay){c.date=b.dataset.calDay;c.view='day';c.by='rooms';render(false);return;}
 if(b.dataset.calSession){if(c.selecting){c.selected=c.selected.includes(b.dataset.calSession)?c.selected.filter(x=>x!==b.dataset.calSession):[...c.selected,b.dataset.calSession];render(false);}else calPanel(b.dataset.calSession);return;}
 if(b.hasAttribute('data-cal-select')){c.selecting=!c.selecting;c.focus=null;c.selected=[];render(false);return;}
 if(b.dataset.calSelectDay){c.selected=[...new Set([...c.selected,...calVisible().filter(e=>e.date===b.dataset.calSelectDay).map(e=>e.id)])];render(false);return;}
 if(b.hasAttribute('data-cal-unselect')){c.selected=[];render(false);return;}
 if(b.hasAttribute('data-cal-filters')){calFilters();return;}
 if(b.hasAttribute('data-cal-save-filters')){for(const k of ['activity','group','teacher','place'])c.filters[k]=Array.from($('dialog').querySelectorAll(`[data-filter-key="${k}"]:checked`)).map(x=>x.value);c.filters.child=$('cal-filter-child')?.value||'';state.scheduleGroup=null;c.selected=[];$('dialog').close();render(false);return;}
 if(b.hasAttribute('data-cal-clear')){c.filters={activity:[],group:[],teacher:[],place:[],child:''};state.scheduleGroup=null;c.selected=[];render(false);return;}
 if(b.dataset.calAction){if(['holiday','add'].includes(b.dataset.calAction))c.focus=null;calChange(b.dataset.calAction);return;}
 if(b.hasAttribute('data-cal-apply')){calApply();return;}
 if(b.hasAttribute('data-cal-back')){if(c.focus)calPanel(c.focus);else $('dialog').close();return;}
 if(b.hasAttribute('data-cal-attendance')){const e=calEvents.find(e=>e.id===c.focus);openAttendance(e.group,e.date==='2026-11-02'?'today':e.date==='2026-11-01'?'yesterday':e.date,false,`${calTime(e.start)}–${calTime(e.end)}`);return;}
 if(b.hasAttribute('data-cal-child')){const e=calEvents.find(e=>e.id===c.focus);state.group=e.group;openChild(b.dataset.calChild);return;}
 if(b.dataset.calGroup){state.group=Number(b.dataset.calGroup);state.groupTab='children';state.childQuery='';state.page='group';$('dialog').close();render();return;}
});
document.addEventListener('change',event=>{if(event.target.id==='cal-date'){if(event.target.value){state.cal.date=event.target.value;state.cal.selected=[];render(false);}}});

function attendance(){return `${head('Присъствия','Отбелязване и преглед на заниманията.')}<div class="section-title"><h2>За отбелязване</h2><small>Понеделник, 2 ноември</small></div><div class="panel">${session(groups[0],'16:00')}</div>${state.role==='office'?`<details class="group-disclosure" style="margin-top:18px"><summary>Отбелязани занимания</summary><div class="panel">${session(groups[3],'15:00',true)}</div></details>`:''}`;}
function empty(title,copy,label,attr){return `<div class="empty"><span class="empty-icon">${icon('people')}</span><h2>${title}</h2><p>${copy}</p>${label?`<button class="btn" ${attr}>${label}</button>`:''}</div>`;}
function scenarioView(){if(state.scenario==='loading')return `${head(state.page==='home'?'Начало':'Записвания','')}<div role="status" aria-label="Зареждане"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><span class="sr">Зареждане на съдържанието</span></div>`;if(state.scenario==='error')return `${head('Не успяхме да заредим','')}<div class="panel">${empty('Връзката прекъсна','Опитайте отново. Въведените данни в макета са запазени.','Опитай пак','data-retry')}</div>`;return `${head(state.page==='home'?'Добър ден, Демо':'Записвания','')}<div class="panel">${empty('Няма чакащи задачи','Когато има нова заявка или занимание за отбелязване, ще го видите тук.',state.role==='office'?'Виж групите':'Виж графика',state.role==='office'?'data-show-groups':'data-page="schedule"')}</div>`;}
function render(focus=true){nav();$('main').innerHTML=state.scenario==='normal'?({home,enrollments,group:groupView,schedule,attendance}[state.page]||home)():scenarioView();$('role').value=state.role;$('scenario').value=state.scenario;$('avatar').textContent=state.role==='office'?'ДО':'ДУ';$('avatar').setAttribute('aria-label',state.role==='office'?'Демо офис':'Демо учител');const heading=$('main').querySelector('h1');if(heading)heading.setAttribute('tabindex','-1');if(focus){const h=heading;if(h){h.focus({preventScroll:true});}window.scrollTo({top:0,behavior:'instant'});}}
function go(page){state.page=page;state.scenario='normal';if(page!=='schedule')state.scheduleGroup=null;render();}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3000);}
function showDialog(html){if(!$('dialog').open)lastDialogFocus=document.activeElement;const wasOpen=$('dialog').open;$('dialog-content').innerHTML=html;if(!wasOpen)$('dialog').showModal();else $('dialog').querySelector('button')?.focus();}
const dialogHead=(title,sub)=>`<header class="dialog-head"><div><h2 id="dialog-title">${title}</h2>${sub?`<small>${sub}</small>`:''}</div><button class="icon-button" data-close-dialog aria-label="Затвори">${icon('close')}</button></header>`;
function openAttendance(id,day='today',review=false,time=null){sessionGroup=Number(id);sessionDay=day;sessionDisplayTime=time;reviewMode=review;dialogChild=null;drawAttendance();}
function drawAttendance(){const g=groups.find(g=>g.id===sessionGroup);const list=rosterNames(g);const present=list.filter((_,i)=>state.marks[markKey(i)]==='present').length;const absent=list.filter((_,i)=>state.marks[markKey(i)]==='absent').length;showDialog(dialogHead(reviewMode?'Преглед на присъствията':'Отбележи присъствия',`${g.activity} · ${g.name} · ${sessionDay==='yesterday'?'1 ноември':sessionDay==='today'?'2 ноември':dateLabel(sessionDay)}, ${sessionDisplayTime||g.time}`)+`<div class="dialog-body"><div class="dialog-counts"><span class="tag success">Присъстват ${present}</span><span class="tag warning">Отсъстват ${absent}</span><span class="tag">Неотбелязани ${list.length-present-absent}</span></div>${reviewMode?'<p class="info-line">Всички деца са отбелязани.</p><button class="btn" data-edit-attendance>Поправи</button>':`<button class="btn wide" data-all-present>${icon('check')}Всички присъстват</button>`}${list.map((n,i)=>`<div class="mark-row"><div class="mark-head"><strong>${n}</strong><button class="icon-button" data-attendance-child="${i}" aria-label="Виж ${n}">${icon('eye')}</button></div>${reviewMode?`<span class="tag ${state.marks[markKey(i)]==='present'?'success':'warning'}">${state.marks[markKey(i)]==='present'?'✓ Присъства':'✕ Отсъства'}</span>`:`<div class="mark-buttons"><button data-mark="present" data-index="${i}" aria-pressed="${state.marks[markKey(i)]==='present'}">Присъства</button><button class="absent" data-mark="absent" data-index="${i}" aria-pressed="${state.marks[markKey(i)]==='absent'}">Отсъства</button></div>`}</div>`).join('')}${reviewMode?'':`<p class="info-line">Отбелязването е за това занимание. Промените се записват автоматично.</p>`}</div><footer class="dialog-foot"><small role="status">✓ Всичко е записано</small><button class="btn primary" data-close-dialog>Готово</button></footer>`);}
function openChild(index,fromAttendance=false){const g=groups.find(g=>g.id===(fromAttendance?sessionGroup:state.group));const name=!fromAttendance&&state.groupTab==='waiting'?'Зоя Демова':rosterNames(g)[Number(index)]||'Демо дете';dialogChild=fromAttendance?Number(index):null;showDialog(dialogHead(name,`${Number(index)%2+1}. клас · ${g.activity} · ${g.name}`)+`<div class="dialog-body"><div class="contact-detail">${fromAttendance?`<button class="btn quiet" data-back-attendance>${icon('back')}Назад към присъствията</button>`:''}<h3>Записване в групата</h3><span class="tag success">Записано</span><p class="muted" style="margin-top:10px">${g.day} · ${g.time}<br>${g.place}</p><h3>Родител</h3><p>Демо родител · майка</p><button class="btn" data-reveal>Покажи телефона</button><p id="phone-result" class="muted"></p></div></div><footer class="dialog-foot"><small>Карта на детето</small><button class="btn primary" ${fromAttendance?'data-back-attendance':'data-close-dialog'}>${fromAttendance?'Назад към присъствията':'Готово'}</button></footer>`);}
function openRequest(id){const r=requests.find(r=>r.id===Number(id));if(!r)return;const g=groups.find(g=>g.id===r.group);showDialog(dialogHead('Заявка за записване',r.name)+`<div class="dialog-body"><div class="contact-detail">${badge(g)}<h3>${g.name} · ${r.grade}</h3><p class="muted">Редовно записване · ${g.day} · ${g.time}</p><h3>Родител</h3><p>Демо родител</p><p class="muted">Заявката е получена на 2 ноември.</p></div></div><footer class="dialog-foot"><button class="btn" data-close-dialog>Назад</button><button class="btn primary" data-approve="${r.id}">Одобри</button></footer>`);}
function openSubstitute(){showDialog(dialogHead('Заместник за заниманието','Шахмат · Начинаещи · Сряда, 4 ноември')+`<div class="dialog-body"><div class="contact-detail"><span class="tag ${state.substitute?'success':'warning'}">${state.substitute?'✓ Има заместник':'Очаква назначаване'}</span><h3>Демо колега</h3><p class="muted">Няма друго занимание по това време.</p></div></div><footer class="dialog-foot"><button class="btn" data-close-dialog>Назад</button>${state.substitute?'':`<button class="btn primary" data-assign>Назначи заместник</button>`}</footer>`);}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.device){$('stage').classList.toggle('phone',b.dataset.device==='phone');document.querySelectorAll('[data-device]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}
if(b.dataset.page){go(b.dataset.page);return;}if(b.dataset.home){state.homeView=b.dataset.home;render(false);return;}if(b.hasAttribute('data-requests')){state.tab='requests';go('enrollments');return;}if(b.hasAttribute('data-show-groups')){state.tab='groups';go('enrollments');return;}if(b.dataset.tab){state.tab=b.dataset.tab;render(false);return;}if(b.dataset.group){state.group=Number(b.dataset.group);state.childQuery='';state.groupTab='children';go('group');return;}if(b.dataset.groupTab){state.groupTab=b.dataset.groupTab;render(false);return;}if(b.dataset.groupSchedule){state.scheduleGroup=Number(b.dataset.groupSchedule);state.cal.view='day';state.cal.by='rooms';go('schedule');return;}if(b.hasAttribute('data-all-schedule')){state.scheduleGroup=null;render();return;}if(b.hasAttribute('data-clear-filters')){state.query='';state.activity='all';render(false);return;}if(b.dataset.attendance){openAttendance(b.dataset.attendance,b.dataset.sessionday||'today',b.dataset.review==='true');return;}if(b.hasAttribute('data-close-dialog')){$('dialog').close();return;}if(b.hasAttribute('data-child')){openChild(b.dataset.child);return;}if(b.hasAttribute('data-attendance-child')){openChild(b.dataset.attendanceChild,true);return;}if(b.hasAttribute('data-back-attendance')){const childIndex=dialogChild;drawAttendance();if(childIndex!==null)$('dialog').querySelector(`[data-attendance-child="${childIndex}"]`)?.focus();return;}if(b.hasAttribute('data-edit-attendance')){reviewMode=false;drawAttendance();return;}if(b.dataset.mark){state.marks[markKey(b.dataset.index)]=b.dataset.mark;const i=b.dataset.index,mark=b.dataset.mark;drawAttendance();$('dialog').querySelector(`[data-index="${i}"][data-mark="${mark}"]`)?.focus();$('announce').textContent='Присъствието е записано';return;}if(b.hasAttribute('data-all-present')){const g=groups.find(g=>g.id===sessionGroup);rosterNames(g).forEach((_,i)=>{if(!state.marks[markKey(i)])state.marks[markKey(i)]='present';});drawAttendance();$('dialog').querySelector('[data-all-present]').focus();return;}if(b.dataset.approve){const r=requests.find(r=>r.id===Number(b.dataset.approve));if(!r)return;const g=groups.find(g=>g.id===r.group);if(g.count>=g.max){toast('Групата е пълна. Заявката остава чакаща.');return;}g.count++;rosters[g.id].push(r.name);grades[r.name]=r.grade;requests=requests.filter(x=>x!==r);if($('dialog').open)$('dialog').close();render(false);toast('Заявката е одобрена. Детето е в групата.');return;}if(b.dataset.requestDetails){openRequest(b.dataset.requestDetails);return;}if(b.hasAttribute('data-substitute')){openSubstitute();return;}if(b.hasAttribute('data-assign')){state.substitute=true;$('dialog').close();render(false);toast('Заместникът е назначен.');return;}if(b.hasAttribute('data-retry')){state.scenario='normal';render();return;}if(b.hasAttribute('data-reveal')){$('phone-result').textContent='Само примерни данни — не се зареждат реални контакти.';b.disabled=true;return;}});
document.addEventListener('change',event=>{const t=event.target;if(t.id==='role'){state.role=t.value;state.cal.filters={activity:[],group:[],teacher:[],place:[],child:''};state.scheduleGroup=null;state.cal.selected=[];state.page='home';state.scenario='normal';render();}if(t.id==='scenario'){state.scenario=t.value;render();}if(t.id==='activity-filter'){state.activity=t.value;$('group-results').innerHTML=filteredGroups();}if(t.id==='select-group'){state.group=Number(t.value);state.childQuery='';state.groupTab='children';render(false);}if(t.name==='approval'){state.approval=t.value;toast('Настройката е записана в макета.');}});
document.addEventListener('input',event=>{if(event.target.id==='group-search'){state.query=event.target.value;$('group-results').innerHTML=filteredGroups();}if(event.target.id==='child-search'){state.childQuery=event.target.value;const g=groups.find(g=>g.id===state.group),q=event.target.value.toLowerCase();const rows=rosterNames(g).map((n,i)=>({n,i})).filter(c=>c.n.toLowerCase().includes(q));$('roster').innerHTML=rows.length?rows.map(c=>childRow(c.n,c.i)).join(''):'<p class="info-line">Няма намерено дете в тази група.</p>';}});
$('dialog').addEventListener('close',()=>{const attrs=['data-attendance','data-sessionday','data-substitute','data-child','data-request-details','data-cal-session','data-cal-filters'];const selector=lastDialogFocus?attrs.filter(a=>lastDialogFocus.hasAttribute(a)).map(a=>`[${a}="${lastDialogFocus.getAttribute(a)}"]`).join(''):'';render(false);const restored=selector?$('main').querySelector(selector):null;if(restored)restored.focus();else $('main').querySelector('h1')?.focus();});
render(false);
})();
</script></body></html>
