upload_max_filesize=8M
post_max_size=10M
; gd keeps 4 bytes a pixel and counts against this limit (it is bundled in the image): a 24-megapixel JPEG takes about
; 96 MB once decoded, a 16-megapixel PNG about 128 MB while it is read (the rows and the picture). Those are the largest
; photos taken (docs/product/teacher-content.md, 5.1); the CI docker job checks they fit next to the framework.
memory_limit=256M
