name: progressive-activities

services:
  api:
    build:
      context: ./apps/api
      target: development
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:cHJvZ3Jlc3NpdmUtbG9jYWwtYXBwLWtleS0wMDAwMDA=
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: progressive
      DB_PGSQL_DATABASE: progressive
      DB_USERNAME: progressive_app
      DB_PASSWORD: progressive-app-local-only
      DB_ADMIN_USERNAME: progressive
      DB_ADMIN_PASSWORD: progressive-local-only
      DEMO_USER_EMAIL: owner@demo.progressive.local
      DEMO_USER_PASSWORD: progressive-demo-local-only
      REDIS_HOST: redis
      SESSION_DRIVER: database
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      API_BASE_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: progressive
      POSTGRES_USER: progressive
      POSTGRES_PASSWORD: progressive-local-only
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    configs:
      - source: postgres-app-role
        target: /docker-entrypoint-initdb.d/01-app-role.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progressive -d progressive"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025"]

volumes:
  postgres-data:
  redis-data:

configs:
  postgres-app-role:
    file: ./infra/docker/postgres-init/01-app-role.sql
