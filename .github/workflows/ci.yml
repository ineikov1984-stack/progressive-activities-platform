name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: progressive
          POSTGRES_USER: progressive
          POSTGRES_PASSWORD: progressive-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progressive -d progressive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: progressive
      DB_PGSQL_DATABASE: progressive
      DB_USERNAME: progressive_app
      DB_PASSWORD: progressive-app-local-only
      DB_ADMIN_USERNAME: progressive
      DB_ADMIN_PASSWORD: progressive-local-only
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          # Same limits as the shipped image (platform/apps/api/docker/catalog-uploads.ini).
          ini-values: upload_max_filesize=8M, post_max_size=10M
      - uses: ramsey/composer-install@v4
        with:
          working-directory: platform/apps/api
      - name: Create restricted application database role
        working-directory: ${{ github.workspace }}
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/platform/infra/docker/postgres-init:/init:ro"
          -e PGPASSWORD=progressive-local-only postgres:17-alpine
          psql -h 127.0.0.1 -U progressive -d progressive
          -v ON_ERROR_STOP=1 -f /init/01-app-role.sql
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: |
          status=0
          vendor/bin/pint --test --format=json > "$RUNNER_TEMP/pint-report.json" || status=$?
          php -r '
            $r = json_decode(file_get_contents(getenv("RUNNER_TEMP") . "/pint-report.json"), true) ?: [];
            foreach (($r["files"] ?? []) as $f) {
              echo "::error file=platform/apps/api/{$f["name"]},title=Code style::" . implode(", ", $f["appliedFixers"] ?? []) . "\n";
            }
          '
          if [ "$status" != 0 ]; then echo "::group::Pint report"; cat "$RUNNER_TEMP/pint-report.json"; echo "::endgroup::"; echo "::error title=Pint raw report::$(head -c 3000 "$RUNNER_TEMP/pint-report.json" | tr '\n' ' ')"; fi
          exit $status
      - name: Static analysis (PHPStan)
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github
      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          php artisan config:clear --ansi
          status=0
          php artisan test --log-junit junit.xml || status=$?
          php -r '
            if (! is_file("junit.xml")) { exit(0); }
            $xml = simplexml_load_file("junit.xml");
            foreach ($xml->xpath("//testcase[failure or error]") as $case) {
              $node = $case->failure ?: $case->error;
              $text = trim(preg_replace("/\s+/", " ", (string) $node));
              $file = str_replace(getcwd() . "/", "", (string) $case["file"]);
              echo "::error file=platform/apps/api/{$file},line={$case["line"]},title={$case["class"]}::{$case["name"]}: " . substr($text, 0, 900) . "\n";
            }
          '
          exit $status
      - name: Security audit of PHP dependencies
        if: ${{ !cancelled() }}
        run: |
          status=0
          composer audit --locked --format=json > "$RUNNER_TEMP/composer-audit.json" || status=$?
          php -r '
            $a = json_decode(file_get_contents(getenv("RUNNER_TEMP") . "/composer-audit.json"), true) ?: [];
            foreach (($a["advisories"] ?? []) as $pkg => $list) {
              foreach ($list as $x) {
                $id = $x["cve"] ?? $x["advisoryId"] ?? "";
                echo "::error title=Security advisory::{$pkg} {$x["affectedVersions"]} - {$x["title"]} ({$id})\n";
              }
            }
            foreach (($a["abandoned"] ?? []) as $pkg => $replacement) {
              echo "::warning title=Abandoned package::{$pkg}" . ($replacement ? " (use {$replacement})" : "") . "\n";
            }
          '
          exit $status

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      # Same as `pnpm verify`, split so a failure shows which check and where.
      - run: pnpm docs:check
      - name: Lint
        run: |
          status=0
          pnpm --filter @progressive/web exec eslint . -f json -o "$RUNNER_TEMP/eslint.json" || status=$?
          node -e '
            const fs = require("fs");
            const file = process.env.RUNNER_TEMP + "/eslint.json";
            if (!fs.existsSync(file)) process.exit(0);
            for (const result of JSON.parse(fs.readFileSync(file, "utf8"))) {
              const path = result.filePath.slice(result.filePath.indexOf("platform/apps/web/"));
              for (const m of result.messages) {
                const level = m.severity === 2 ? "error" : "warning";
                console.log(`::${level} file=${path},line=${m.line || 1},col=${m.column || 1},title=${m.ruleId || "eslint"}::${m.message.replace(/\r?\n/g, " ")}`);
              }
            }
          '
          exit $status
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm test
      - if: ${{ !cancelled() }}
        run: pnpm build
      - run: pnpm --filter @progressive/web exec playwright install --with-deps chromium
      # Browser suites that use synthetic API fixtures. The smoke suite against the real
      # API and database runs in the e2e-stack job; the remaining demo-database suites
      # run locally against the Docker stack (see docs/process/WORKFLOW.md).
      - name: Browser tests (synthetic fixtures)
        run: pnpm --filter @progressive/web exec playwright test --config=playwright.isolated.config.ts --reporter=github,line

  e2e-stack:
    name: e2e (real API + database)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: progressive
          POSTGRES_USER: progressive
          POSTGRES_PASSWORD: progressive-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progressive -d progressive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    # Based on platform/compose.yaml (local-only, synthetic demo data). CI differences:
    # APP_DEBUG off, no Redis (cache and queue use the database), mail goes to the log.
    env:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: progressive
      DB_PGSQL_DATABASE: progressive
      DB_USERNAME: progressive_app
      DB_PASSWORD: progressive-app-local-only
      DB_ADMIN_USERNAME: progressive
      DB_ADMIN_PASSWORD: progressive-local-only
      DEMO_USER_EMAIL: owner@demo.progressive.local
      DEMO_USER_PASSWORD: progressive-demo-local-only
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      MAIL_MAILER: log
      API_BASE_URL: http://127.0.0.1:8080
      # More than one PHP worker so page renders and browser API calls do not queue.
      PHP_CLI_SERVER_WORKERS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          ini-values: upload_max_filesize=8M, post_max_size=10M
      - uses: ramsey/composer-install@v4
        with:
          working-directory: platform/apps/api
      - name: Create restricted application database role
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/platform/infra/docker/postgres-init:/init:ro"
          -e PGPASSWORD=progressive-local-only postgres:17-alpine
          psql -h 127.0.0.1 -U progressive -d progressive
          -v ON_ERROR_STOP=1 -f /init/01-app-role.sql
      - name: Prepare and start the API
        working-directory: platform/apps/api
        run: |
          cp .env.example .env && php artisan key:generate --ansi
          # Migrations run as the database owner; the API itself uses the restricted role (RLS).
          php artisan migrate --database=pgsql_admin --force --ansi
          php artisan db:seed --class='Database\Seeders\LocalDemoSeeder' --force --ansi
          php artisan db:seed --class='Database\Seeders\E2eForeignTenantSeeder' --force --ansi
          nohup php artisan serve --host=127.0.0.1 --port=8080 --no-reload > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/up >/dev/null && exit 0; sleep 1; done
          echo "::error title=API did not start::$(tail -c 2000 "$RUNNER_TEMP/api.log" | tr '\n' ' ')"; exit 1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - working-directory: platform
        run: pnpm install --frozen-lockfile
      - working-directory: platform
        run: pnpm --filter @progressive/web build
      - working-directory: platform
        run: pnpm --filter @progressive/web exec playwright install --with-deps chromium
      - name: Browser tests against the real stack
        working-directory: platform
        run: pnpm --filter @progressive/web exec playwright test --config=playwright.stack.config.ts --reporter=github,line
      - name: API log on failure
        if: ${{ failure() }}
        run: |
          tail -n 60 platform/apps/api/storage/logs/laravel.log 2>/dev/null | grep -E "ERROR|Exception" | while IFS= read -r line; do echo "::warning title=Laravel log::${line:0:900}"; done || true
      - name: Keep Playwright traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-stack-traces
          path: platform/apps/web/test-results/
          retention-days: 7
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --target development -t progressive-api platform/apps/api
      - name: Build web image
        run: docker build --target development -f platform/apps/web/Dockerfile -t progressive-web platform

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The scanner image gets the working tree; keep the GitHub token out of it.
          persist-credentials: false
      - name: Scan the full history for committed secrets (gitleaks)
        run: |
          status=0
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json || status=$?
          if [ -s gitleaks-report.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Possible secret (\(.RuleID))::commit \(.Commit[0:8]) by \(.Author)"' gitleaks-report.json
          fi
          exit $status
