name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: progressive
          POSTGRES_USER: progressive
          POSTGRES_PASSWORD: progressive-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progressive -d progressive"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: progressive
      DB_PGSQL_DATABASE: progressive
      DB_USERNAME: progressive_app
      DB_PASSWORD: progressive-app-local-only
      DB_ADMIN_USERNAME: progressive
      DB_ADMIN_PASSWORD: progressive-local-only
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: platform/apps/api
      - name: Create restricted application database role
        working-directory: ${{ github.workspace }}
        run: >-
          docker run --rm --network host
          -v "${{ github.workspace }}/platform/infra/docker/postgres-init:/init:ro"
          -e PGPASSWORD=progressive-local-only postgres:17-alpine
          psql -h 127.0.0.1 -U progressive -d progressive
          -v ON_ERROR_STOP=1 -f /init/01-app-role.sql
      - run: cp .env.example .env && php artisan key:generate
      - name: Lint, static analysis and tests
        run: composer verify
      - name: Security audit of PHP dependencies
        if: ${{ !cancelled() }}
        run: |
          status=0
          composer audit --locked --format=json > composer-audit.json || status=$?
          php -r '
            $a = json_decode(file_get_contents("composer-audit.json"), true) ?: [];
            foreach (($a["advisories"] ?? []) as $pkg => $list) {
              foreach ($list as $x) {
                $id = $x["cve"] ?? $x["advisoryId"] ?? "";
                echo "::error title=Security advisory::{$pkg} {$x["affectedVersions"]} - {$x["title"]} ({$id})\n";
              }
            }
            foreach (($a["abandoned"] ?? []) as $pkg => $replacement) {
              echo "::warning title=Abandoned package::{$pkg}" . ($replacement ? " (use {$replacement})" : "") . "\n";
            }
          '
          exit $status

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm verify
      - run: pnpm --filter @progressive/web exec playwright install --with-deps chromium
      # Browser suites that use synthetic API fixtures. Suites that need the seeded
      # demo database run locally against the Docker stack (see docs/process/WORKFLOW.md).
      - name: Browser tests (synthetic fixtures)
        run: pnpm --filter @progressive/web exec playwright test --config=playwright.isolated.config.ts --reporter=github,line
